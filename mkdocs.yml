site_name: ERCI Apps · DAM
site_description: Recursos educativos de los módulos de Desarrollo de Aplicaciones Multiplataforma
site_url: https://erciapps.sytes.net/

nav:
  - Inicio: index.md

  - Sistemas Informáticos:
      - Portada: si/index.md
      - UD1 · Introducción al entorno Linux: si/ud1/index.md

  - PMDM:
      - Portada: pmdm/index.md
      - Videojuegos 2D con Unity:
          - Ruta de aprendizaje: pmdm/videojuegos/index.md
          - 1. Crear el proyecto: pmdm/videojuegos/01-primer-proyecto.md
          - 2. Entorno de Unity: pmdm/videojuegos/02-entorno-unity.md
          - 3. Assets y sprites: pmdm/videojuegos/03-assets-sprites.md
          - 4. Primer script: pmdm/videojuegos/04-primer-script.md
          - 5. Movimiento y salto: pmdm/videojuegos/05-movimiento-salto.md
          - Ejemplo · ERCIGAME 2D: pmdm/videojuegos/ercigame-2d-primeros-pasos.md
          - 6. Escenario con Tilemap: pmdm/videojuegos/06-tilemap-escenario.md
          - 7. Colisiones y físicas: pmdm/videojuegos/07-colisiones-fisicas.md
          - 8. Animaciones: pmdm/videojuegos/08-animaciones.md
          - 9. Orientación del personaje: pmdm/videojuegos/09-orientacion-personaje.md
          - 10. Objetos recogibles: pmdm/videojuegos/10-objetos-recogibles.md
          - Ejercicio · Tu propio videojuego: pmdm/videojuegos/11-ejercicio-propio-juego.md
      - Recursos: pmdm/recursos.md

  - Desarrollo de Interfaces:
      - Portada: ddi/index.md

  - Proyecto II:
      - Portada: proyecto2/index.md

theme:
  name: material
  language: es
  logo: assets/images/ercilogo2.png
  favicon: assets/images/favicon.ico
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link

plugins:
  - search:
      lang: es

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - assets/stylesheets/erci-site.css

extra_javascript:
  - assets/javascripts/home.js

extra:
  generator: false

copyright: IES Alonso de Ercilla · Curso 2026-2027
